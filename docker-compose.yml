services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: travelmind
      POSTGRES_PASSWORD: travelmind
      POSTGRES_DB: travelmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelmind -d travelmind"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
